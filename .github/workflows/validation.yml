name: validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.2'
      - name: Dependencies
        run: uv sync --locked
      - name: Index privacy audit
        run: python scripts/audit_index.py
      - name: Lint and test
        run: |
          uv run ruff check __init__.py hermes_plugin src tests scripts examples packaging
          uv run ruff format --check __init__.py hermes_plugin src tests scripts examples packaging
          uv run pytest -q tests packaging
      - name: Build and clean wheel installation
        run: |
          uv build
          uv venv "$RUNNER_TEMP/afl-wheel"
          uv pip install --python "$RUNNER_TEMP/afl-wheel/bin/python" dist/agent_fix_lab-0.5.0-py3-none-any.whl
          "$RUNNER_TEMP/afl-wheel/bin/afterforge" --help
          "$RUNNER_TEMP/afl-wheel/bin/agent-fix-lab" --help
      - name: Synthetic browser fixtures
        run: |
          uv run python scripts/browser_fixture.py "$RUNNER_TEMP/afl-fixture"
          uv run playwright install --with-deps chromium
      - name: Three fresh-server wheel browser workflows
        run: |
          uv run python scripts/browser_smoke.py --python "$RUNNER_TEMP/afl-wheel/bin/python" --home "$RUNNER_TEMP/afl-fixture/lab" --recipe-file "$RUNNER_TEMP/afl-fixture/recipe.json" --query Unfamiliar --repeat 3 --interventions
      - name: Three fresh installed-wheel guided workflows (no silent browser skips)
        run: |
          AFL_CHROMIUM=$(uv run python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          export AFL_CHROMIUM
          export AFL_BROWSER_PYTHON="$RUNNER_TEMP/afl-wheel/bin/python"
          test -x "$AFL_CHROMIUM"
          uv run pytest -q tests/test_guided_release.py -k guided_fresh_browser
      - name: Portable bundle installed-CLI round trip
        run: |
          uv run python scripts/bundle_smoke.py --python "$RUNNER_TEMP/afl-wheel/bin/python" --home "$RUNNER_TEMP/afl-fixture/lab" --recipe-file "$RUNNER_TEMP/afl-fixture/recipe.json" --output-directory "$RUNNER_TEMP/afl-roundtrip" --file implementation.py
