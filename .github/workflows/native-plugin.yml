name: native-plugin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      distribution: ${{ steps.release.outputs.distribution }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.2'
      - name: Reproducible candidate (not a supported release)
        id: release
        run: |
          PREVIOUS_ARGS=()
          if git show-ref --verify --quiet refs/remotes/origin/plugin-release; then
            PREVIOUS_ARGS=(--previous "$(git rev-parse origin/plugin-release)")
          fi
          python scripts/plugin_release.py "$RUNNER_TEMP/native-release" --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --commit "${PREVIOUS_ARGS[@]}" --sha-file "$RUNNER_TEMP/release.sha"
          python scripts/plugin_release.py "$RUNNER_TEMP/native-release-repeat" --revision "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --commit "${PREVIOUS_ARGS[@]}" --sha-file "$RUNNER_TEMP/repeat.sha"
          cmp "$RUNNER_TEMP/release.sha" "$RUNNER_TEMP/repeat.sha"
          RELEASE_SHA=$(<"$RUNNER_TEMP/release.sha")
          git push origin "$RELEASE_SHA:refs/heads/plugin-release"
          printf 'distribution=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-distribution
          path: ${{ runner.temp }}/release.sha
          if-no-files-found: error
  host-lifecycle:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host:
          - 277268d83ff2204de9646f0b1e376e73ac0a5d20
          - 939e45c91d751fadd94dcd1b873ac3cb44846213
    env:
      RELEASE_SHA: ${{ needs.candidate.outputs.distribution }}
      AFTERFORGE_SOURCE_ID: synthetic-native-fixture
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.2'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.host }}
          path: .host-hermes
      - name: Isolated stock host and exact candidate scan
        run: |
          uv venv "$RUNNER_TEMP/hermes-env" --python 3.11
          uv pip install --python "$RUNNER_TEMP/hermes-env/bin/python" --editable .host-hermes
          uv sync --locked
          uv run pytest -q
          uv run python scripts/browser_fixture.py "$RUNNER_TEMP/native-fixture"
          git fetch origin "$RELEASE_SHA"
          mkdir "$RUNNER_TEMP/native-release"
          git archive "$RELEASE_SHA" | tar -x -C "$RUNNER_TEMP/native-release"
          export PYTHONPATH="$GITHUB_WORKSPACE/.host-hermes"
          "$RUNNER_TEMP/hermes-env/bin/python" scripts/plugin_scan_gate.py "$RUNNER_TEMP/native-release"
          "$RUNNER_TEMP/hermes-env/bin/hermes" plugins doctor "$RUNNER_TEMP/native-release" --ci
      - name: Pinned GitHub install and real registry lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$RUNNER_TEMP/hermes-env/bin:$PATH"
          export HERMES_HOME="$RUNNER_TEMP/native-home"
          export HERMES_BUNDLED_PLUGINS="$RUNNER_TEMP/empty-plugins"
          export PYTHONPATH="$GITHUB_WORKSPACE/.host-hermes"
          mkdir -p "$HERMES_HOME" "$HERMES_BUNDLED_PLUGINS"
          touch "$HERMES_HOME/.afl-isolated-test"
          gh auth setup-git
          hermes --version
          # Normal stock caution confirmation, only after exact-warning review above.
          # Dangerous verdicts still block with --force. Scanning stays enabled.
          hermes plugins install "$GITHUB_REPOSITORY" --ref "$RELEASE_SHA" --enable --force
          test "$(git -C "$HERMES_HOME/plugins/agent-fix-lab" rev-parse HEAD)" = "$RELEASE_SHA"
          hermes plugins list
          hermes plugins capabilities agent-fix-lab
          # Initialize only this isolated synthetic home with the stock host's
          # actual schema. A schema-26 fixture must not mask schema-30 rejection.
          python -c 'from hermes_state import SessionDB; db = SessionDB(); db.close()'
          hermes afterforge setup
          hermes afterforge doctor
          hermes fixlab doctor
          hermes afterforge scan
          python scripts/plugin_lifecycle.py --fixture "$RUNNER_TEMP/native-fixture"
          if hermes plugins update agent-fix-lab; then
            printf 'ERROR: pinned update unexpectedly succeeded\n'
            exit 1
          else
            test "$?" -eq 1
          fi
          test "$(git -C "$HERMES_HOME/plugins/agent-fix-lab" rev-parse HEAD)" = "$RELEASE_SHA"
          hermes fixlab uninstall-runtime --confirm
          hermes plugins disable agent-fix-lab
          hermes plugins enable agent-fix-lab
          hermes plugins disable agent-fix-lab
          hermes plugins remove agent-fix-lab
          test ! -d "$HERMES_HOME/plugins/agent-fix-lab"
          test -f "$HERMES_HOME/plugin-data/agent-fix-lab/data/lab.sqlite"
          test ! -d "$HERMES_HOME/plugin-data/agent-fix-lab/runtime"
          test ! -d "$HERMES_HOME/plugin-data/agent-fix-lab/runtimes"
          printf 'Verified native release: %s\n' "$RELEASE_SHA"
