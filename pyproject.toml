[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-fix-lab"
version = "0.5.1"
description = "Local-first regression workbench that turns Hermes failures and corrections into reproducible, evidence-backed test cases."
readme = "README.md"
keywords = ["hermes", "regression", "pytest", "local-first", "agent-evaluation"]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.52.4", "pydantic==2.13.5", "pytest==9.1.1",
  "triage @ git+https://github.com/ussyverse/triageussy.git@36a391039b286a5571c91574267efe644d8ec1fe",
  "petrichor @ git+https://github.com/ussyverse/petrichorussy.git@76b19e47e1aa1800e16b02aa73a8462bacddcad6",
  "correction-aware-learning @ git+https://github.com/mojomast/hermes-correction-aware-learning.git@84c8c8c7e27c820cbc1aa0a5fcf99f891f503f48"
]

[project.scripts]
afterforge = "agent_fix_lab.cli:main"
agent-fix-lab = "agent_fix_lab.cli:main"

[project.urls]
Homepage = "https://github.com/ussyverse/afterforge"
Issues = "https://github.com/ussyverse/afterforge/issues"

[dependency-groups]
dev = ["ruff==0.16.7", "httpx==0.28.1", "build==1.3.0", "playwright==1.62.0"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agent_fix_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# Native plugin folder names contain hyphens; boundaries must isolate all exceptions.
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["N999"]
"hermes_plugin/*.py" = ["BLE001", "S110", "TRY004"]
"src/agent_fix_lab/plugin_bridge.py" = ["BLE001"]
